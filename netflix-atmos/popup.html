<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atmosphere</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hero">
    <img class="logo" src="images/icon-96.png" alt="" width="34" height="34">
    <div class="head">
      <div class="titlebar">
        <span class="name">Atmosphere</span>
        <span class="site" id="site"></span>
      </div>
      <p class="subline" id="subline"></p>
    </div>
  </header>

  <main>
    <section class="card now" id="now">
      <div class="row" id="row-audio"><span class="dot"></span><span class="label">Audio</span><b id="audioMain">—</b></div>
      <div class="row" id="row-video"><span class="dot"></span><span class="label">Video</span><b id="videoMain">—</b></div>
    </section>

    <section class="card">
      <label class="setting">
        <span><b id="requestName">Dolby Atmos</b><small id="requestDesc">Request Atmos from the site</small></span>
        <input type="checkbox" id="t-request" class="switch">
      </label>
    </section>

    <section class="card nerds" id="nerds">
      <button class="nerds-toggle" id="nerdsToggle" aria-expanded="false" aria-controls="nerdsWrap">Stats for nerds</button>
      <div class="nerds-wrap" id="nerdsWrap"><div class="nerds-body">

      <dl class="stats" id="stats"></dl>

      <div id="disneySettings" hidden>
        <p class="group">Disney+ video</p>
        <label class="setting">
          <span><b>Quality</b><small id="qualityDesc"></small></span>
          <select id="s-quality" class="select">
            <option value="max">Highest</option>
            <option value="auto">Auto</option>
            <option value="2160">4K</option>
            <option value="1440">1440p</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
          </select>
        </label>
        <label class="setting">
          <span><b>HDR</b><small>Applies when a title starts</small></span>
          <select id="s-range" class="select">
            <option value="dv">Dolby Vision</option>
            <option value="hdr10">HDR10</option>
            <option value="sdr">SDR</option>
          </select>
        </label>
      </div>

      <p class="group">Atmos mode</p>
      <label class="setting">
        <span><b>Prime Atmos mode</b><small>Near-silent clip so Safari outputs Atmos</small></span>
        <input type="checkbox" id="t-prime" class="switch">
      </label>
      <button id="primeNow" class="btn">Prime now</button>

      <p class="group">Debugging</p>
      <label class="setting">
        <span><b>Debug mode</b><small>Keep logs here and in the console</small></span>
        <input type="checkbox" id="t-debug" class="switch">
      </label>
      <div class="logs" id="logs" hidden>
        <div class="logs-head">
          <span>Logs <em id="logCount">0</em></span>
          <span><button id="copy" class="link">Copy</button><button id="clear" class="link">Clear</button></span>
        </div>
        <ul id="logList"></ul>
      </div>
      </div></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
